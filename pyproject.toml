[project]
name = "agent-benchmark"
version = "0.1.0"
description = "Composable harness for evaluating tool-using agents in isolated environments."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
]
llm = ["openai>=1.0"]

[project.scripts]
benchmark = "benchmark.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use long single-line fixtures and assert statements.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Optional integrations are imported lazily and may not be installed in CI.
[[tool.mypy.overrides]]
module = ["inspect_ai", "inspect_ai.*", "openai", "openai.*"]
ignore_missing_imports = true
